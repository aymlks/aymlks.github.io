<script>
(function(){
  var links = document.querySelectorAll('.nav a');
  var prev = null, next = null;
  links.forEach(function(a){
    if (a.classList.contains('off')) return;
    if (a.textContent.indexOf('前へ') >= 0) prev = a.getAttribute('href');
    if (a.textContent.indexOf('次へ') >= 0) next = a.getAttribute('href');
  });
  var sx = 0, sy = 0, tracking = false;
  document.addEventListener('touchstart', function(e){
    if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true; }
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (!tracking) return; tracking = false;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) >= 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0 && next) location.href = next;
      if (dx > 0 && prev) location.href = prev;
    }
  }, {passive:true});
})();
</script>
<script>
(function(){
  var link = document.querySelector('a.zoom');
  var ovl = document.getElementById('ovl');
  if (!link || !ovl) return;
  link.addEventListener('click', function(e){
    e.preventDefault();
    ovl.classList.add('open');
    document.body.style.overflow = 'hidden';
  });
  ovl.addEventListener('click', function(e){
    if (e.target.tagName !== 'IMG') {
      ovl.classList.remove('open');
      document.body.style.overflow = '';
    }
  });
})();
</script>
